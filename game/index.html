<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Twin Harbours — Spot the Difference</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #101623; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: pointer; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Twin Harbours, a spot the difference game: two near-identical pictures side by side; click the differences before the clock runs out"></canvas>
<p id="status" role="status" aria-live="polite">Twin Harbours: find the differences between the two pictures before time runs out.</p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
